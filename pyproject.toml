[project]
name = "homelab-hardening-scanner"
version = "0.1.0"
description = "Automated SecOps tool to audit Linux server security posture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0"
]

[project.scripts]
homelab-scanner = "scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
