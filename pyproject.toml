[project]
name = "homelab-hardening-scanner"
version = "0.1.0"
description = "Automated SecOps tool to audit Linux server security posture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "typer>=0.15.0"
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0"
]

[project.scripts]
homelab-scanner = "scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "D401",
    "FBT001",
    "FBT002",
    "ISC001",
    "PLR2004",
    "S105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]
